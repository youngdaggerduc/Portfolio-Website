# Render Blueprint — one-click deploy of the FastAPI backend.
# Visit https://dashboard.render.com/blueprints, click "New Blueprint", pick this repo.
# After creation set the OPENAI_API_KEY (and SMTP_* if you want the contact form working)
# under Environment in the Render dashboard.
services:
  - type: web
    name: portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: OPENAI_API_KEY
        sync: false           # set in dashboard, never committed
      - key: ALLOWED_ORIGINS
        sync: false           # set to your Vercel/Netlify origin in dashboard
      - key: DATABASE_URL
        value: sqlite://db.sqlite3
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GAMES_MODEL
        value: gpt-4o-mini
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
